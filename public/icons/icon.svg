<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" opacity="0.8" />

  <!-- Outer Pulse Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#4f46e5" stroke-width="3" opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.4" />

  <!-- Main Security Shield Frame -->
  <path d="M 256 96 
           C 340 96 400 128 400 128
           C 400 280 320 376 256 416
           C 192 376 112 280 112 128
           C 112 128 172 96 256 96 Z"
        fill="url(#shieldGrad)"
        filter="url(#glow)"
        opacity="0.95" />

  <!-- Shield Inset Inner Core -->
  <path d="M 256 122 
           C 324 122 374 148 374 148
           C 374 270 308 350 256 384
           C 204 350 138 270 138 148
           C 138 148 188 122 256 122 Z"
        fill="#0b0f19" />

  <!-- API Radar / Scope Crosshairs -->
  <line x1="256" y1="160" x2="256" y2="340" stroke="#818cf8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="170" y1="250" x2="342" y2="250" stroke="#818cf8" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Radar Scope Arcs -->
  <circle cx="256" cy="250" r="56" fill="none" stroke="url(#pulseGrad)" stroke-width="5" opacity="0.85" />
  <circle cx="256" cy="250" r="28" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.95" />

  <!-- Central Pulsing Node -->
  <circle cx="256" cy="250" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="250" r="5" fill="#ffffff" />
</svg>
